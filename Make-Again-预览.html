/* Native WXSS adaptation of the supplied letter-opening-demo. */
.ml-root {box-sizing:border-box}
  .ml-root{--cream:#F8F5FB;--gold:#B4A0C6;--rose:#B28CAA;--navy:#FBFBFD;position:relative;isolation:isolate;width:100%;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 62% 75% at 50% 43%,#F1EDF7 0%,#F7F4FA 45%,#FAF9FD 82%,#FBFBFD 100%);color:#756A7E;font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;-webkit-font-smoothing:antialiased}
  .ml-root:before{content:'';position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(ellipse 40% 30% at 53% 47%,#D3C4E540,transparent 67%),radial-gradient(ellipse 40% 25% at 12% 32%,#CEC3DE23,transparent 80%),radial-gradient(ellipse 35% 23% at 88% 72%,#E3CADF18,transparent 80%);filter:blur(24px)}
  .ml-root:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.33;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
  .ml-halo{position:absolute;width:min(70vw,620px);aspect-ratio:1;border:1px solid rgba(129,114,143,.13);border-radius:50%;left:50%;top:51%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 90px rgba(129,114,143,.05),inset 0 0 130px rgba(129,114,143,.025)}
  .ml-halo:before,.ml-halo:after{content:'';position:absolute;border:1px solid rgba(129,114,143,.08);border-radius:50%;inset:32px}.ml-halo:after{inset:77px;border-style:dashed;opacity:.55}
  .ml-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#C5B8D2;opacity:.4;box-shadow:0 0 9px #D7CCE4;animation:mlTwinkle var(--dur,4s) ease-in-out infinite alternate;pointer-events:none}
  @keyframes mlTwinkle{from{opacity:.08;transform:scale(.6)}to{opacity:.85;transform:scale(1.7)}}
  .ml-petal{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:calc(var(--s)*1.5);border-radius:90% 4% 90% 4%;background:linear-gradient(145deg,#D9CBE5,#A491B9);opacity:0;transform:rotate(var(--r));pointer-events:none;filter:drop-shadow(0 0 4px #A491B930);animation:mlPetal var(--t) linear var(--delay) infinite}
  @keyframes mlPetal{0%{opacity:0;transform:translate3d(-12px,-36px,0) rotate(var(--r))}15%{opacity:.65}80%{opacity:.3}100%{opacity:0;transform:translate3d(48px,360px,0) rotate(calc(var(--r) + 390deg))}}
  .ml-topline{position:absolute;top:clamp(24px,5vh,52px);left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;z-index:20;pointer-events:none;letter-spacing:.28em;text-transform:uppercase;color:#81728F;font-size:12px}
  .ml-topline-rule{width:32px;height:1px;background:linear-gradient(90deg,transparent,#B4A0C69C)}.ml-topline-rule:last-child{transform:rotate(180deg)}
  .ml-topline-label{font-weight:500}
  .ml-scene{position:absolute;left:50%;top:51%;width:640px;height:660px;transform:translate(-50%,-50%);perspective:1300px;transform-style:flat;z-index:6;pointer-events:none}
  .ml-shadow{position:absolute;left:50%;top:calc(50% + 156px);width:300px;height:45px;transform:translateX(-50%);border-radius:50%;background:#81728F24;filter:blur(25px);opacity:.75;transition:opacity 1.3s ease}
  .ml-envelope{position:absolute;left:50%;top:50%;width:368px;height:247px;transform:translate(-50%,-42%) rotateX(8deg) rotateY(-9deg) rotateZ(-3deg);transform-style:preserve-3d;cursor:pointer;z-index:4;pointer-events:auto;outline:none;filter:drop-shadow(0 22px 24px #81728F30);animation:mlEnvelopeIdle 5s ease-in-out infinite}
  
  @keyframes mlEnvelopeIdle{0%,100%{transform:translate(-50%,-42%) rotateX(8deg) rotateY(-9deg) rotateZ(-3deg)}50%{transform:translate(-50%,-46%) rotateX(6deg) rotateY(-5deg) rotateZ(-2deg)}}
  .ml-env-back{position:absolute;inset:0;border:1px solid #D8CEE5BB;border-radius:5px;background:linear-gradient(130deg,#E1D8E8,#B8AAC6 52%,#CEC2D8);box-shadow:inset 0 0 30px #81728F24,0 8px 28px #81728F18;overflow:hidden}
  .ml-env-back:after{content:'';position:absolute;inset:11px;border:1px solid #F9F6FCB0;pointer-events:none}
  .ml-env-inside{position:absolute;inset:9px;background:linear-gradient(180deg,#81718E,#A191AC 70%,#B4A3BF);clip-path:polygon(0 0,100% 0,50% 80%);z-index:2}

.ml-root.letter-overlay { position: fixed; inset: 0; width: 100%; height: 100%; min-height: 0; z-index: 100; font-family: 'MAMottoWenKai', 'KaiTi', 'STKaiti', serif; }

.letter-paper { position: relative; width: calc(var(--ma-rpx) * 640); max-width: 88vw; height: 78vh; max-height: calc(100% - calc(var(--ma-rpx) * 100)); display: flex; flex-direction: column; border: calc(var(--ma-rpx) * 1) solid #E8E1EE; border-radius: calc(var(--ma-rpx) * 10); background: radial-gradient(ellipse at 50% 10%, #FFFDFF, #F7F4FA 88%); box-shadow: 0 calc(var(--ma-rpx) * 26) calc(var(--ma-rpx) * 90) #81728F24, inset 0 0 calc(var(--ma-rpx) * 36) #CCBDD720; color: #756A7E; overflow: hidden; animation: letter-readable .55s ease-out both; }

.letter-heading { display: block; font-size: calc(var(--ma-rpx) * 42); font-weight: 400; margin-top: calc(var(--ma-rpx) * 10); line-height: 1.6; color: #504557; }
.letter-divider { color: #A58DB5; font-size: calc(var(--ma-rpx) * 24); margin-top: calc(var(--ma-rpx) * 8); }
.letter-scroll { flex: 1; height: 0; min-height: 0; width: 100%; }
.letter-body { padding: calc(var(--ma-rpx) * 20) calc(var(--ma-rpx) * 38) calc(var(--ma-rpx) * 42); }
.letter-salutation { display: block; font-size: calc(var(--ma-rpx) * 30); margin-bottom: calc(var(--ma-rpx) * 24); }

.continue-letter, .back-letter { font-family: inherit; font-size: calc(var(--ma-rpx) * 32); font-weight: 400; width: 100%; border-radius: calc(var(--ma-rpx) * 48); line-height: calc(var(--ma-rpx) * 88); background: #81728f; color: #FFFDFF; margin-top: calc(var(--ma-rpx) * 36); }

.ma-tabs{display:flex;justify-content:space-between;border-bottom:1px solid #EFEDF3;margin:-14px -3px 18px}.ma-tabs button{position:relative;padding:18px 12px;background:none;border:0;color:#92909B;font-size:15px}.ma-tabs button.active{color:#746786}.ma-tabs button.active::after{content:'';position:absolute;bottom:0;width:21px;height:2px;background:#8D7D9A;border-radius:2px;left:50%;transform:translateX(-50%)}
.ma-empty{text-align:center;padding:78px 8px;color:#A39BAF;font-size:14px;line-height:2}.ma-empty .ma-icon{display:block;width:40px;height:40px;margin:0 auto 18px;color:#C8BED2}
.ma-identity{display:flex;align-items:center;gap:15px;margin:14px 0 28px}.ma-avatar{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#F0EDF5}.ma-avatar .ma-icon{width:28px;height:28px}.ma-name{font-size:21px}.ma-settings{border-radius:14px;background:#FFF;overflow:hidden}.ma-settings .ma-list-row{border-radius:0;border-bottom:1px solid #F2EFF5}
.ma-splash{position:absolute;inset:0;height:100%;min-height:0;z-index:110}
.ma-phone:has(#splash:not([hidden])) .ma-status,.ma-phone:has(#splash:not([hidden])) .ma-header{background:transparent}
.ma-phone:has(#splash:not([hidden])) .ma-body{visibility:hidden}
.ml-root.letter-overlay{position:absolute;inset:0;height:100%;min-height:0;width:100%;z-index:100}
.ml-scene{transform:translate(-50%,-50%) scale(.66)!important}.ml-halo{width:92%;left:50%;top:51%}.ml-topline{top:23px;font-size:10px;letter-spacing:.23em}
.letter-paper{height:78%;max-height:calc(100% - 48px);width:calc(var(--ma-rpx) * 640);max-width:88%;}
.letter-scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#D8CEE5 transparent;-webkit-overflow-scrolling:touch}.letter-scroll:focus{outline:none}.letter-scroll:focus-visible{outline:1px solid #D8CEE5;outline-offset:-1px}
.letter-paragraph{margin-top:0;font-weight:400}.is-reading [data-animation-only]{display:none}.letter-body .continue-letter,.letter-body .back-letter{display:block;padding:0;border:0}
.ma-arrival-paper{position:fixed;z-index:150;pointer-events:none;margin:0!important;animation:none!important;max-width:none;max-height:none;transform-origin:center center;}
.ma-letter-placed{animation:ma-letter-placed 1.3s ease-out}.ma-placed-note{font-size:12px;color:#9C8AA7;margin:14px 6px;line-height:1.7}
@keyframes ma-letter-placed{0%{box-shadow:0 0 0 0 #C7B3D06B;background:#F5EEF8}60%{box-shadow:0 0 0 9px #C7B3D000}100%{box-shadow:none;background:#FFF}}
.ma-dialog-layer{position:absolute;inset:0;background:#81728F22;display:grid;place-items:center;z-index:200;padding:30px}.ma-dialog{width:100%;padding:25px;background:#FFF;border-radius:18px;color:#756A7E;box-shadow:0 15px 60px #81728F20}.ma-dialog h2{font-size:18px;text-align:center;font-weight:500;color:#504557;margin:0 0 18px}.ma-dialog p{font-size:14px;line-height:1.8;margin:0 0 23px}.ma-dialog button{width:100%;border:0;background:#81728F;color:#FFF;padding:11px;border-radius:22px}
@media(max-width:480px){body{background:#EDF1F9}.preview-toolbar{margin-top:10px;margin-bottom:10px}.ma-phone{height:calc(100dvh - 56px);min-height:450px;border-radius:0;margin-bottom:0;box-shadow:none}.preview-label{font-size:12px}.preview-tools button{font-size:11px;padding:6px 9px}}
@media(prefers-reduced-motion:reduce){.ma-letter-placed,.ma-phone{animation:none}}

      <div class="ma-empty" id="emptyCollection" hidden><span class="ma-icon" data-icon="collection"></span>暂无收藏</div>

    <section id="chat" class="ma-page" hidden><div class="ma-greeting"><span class="ma-kicker">此刻</span><h1 class="ma-title">写下此刻</h1></div><p class="ma-description">可以先写一点想说的话。</p><textarea aria-label="想说的话" placeholder="今天，你想从哪里说起？" style="width:100%;height:180px;margin-top:20px;padding:16px;border:1px solid #E8E1EE;border-radius:14px;background:#FFF;color:#756A7E;font:inherit;resize:vertical"></textarea></section>

    </section>

  </div>
</div>

  <div data-animation-only class="ml-intro">
    <span class="ml-intro-main">轻点封口的火漆，拆开这封信</span>
    <span class="ml-intro-sub">TAP THE SEAL TO OPEN</span>
  </div>
  <div class="letter-paper" id="letterPaper" hidden>
    <div class="letter-header"><span class="letter-eyebrow">来自主创团队</span><span class="letter-heading" id="letterHeading">给你的一封信</span><div class="letter-divider">✦</div></div>
    <div class="letter-scroll" tabindex="0" aria-label="信件正文">
      <div class="letter-body">
        <span class="letter-salutation">亲爱的你：</span>
        <p class="letter-paragraph">在正式使用之前，Make Again 主创想跟你分享两段自己的故事：</p>
<p class="letter-paragraph">高中时期，我谈过一段非常内耗的恋爱。</p>
<p class="letter-paragraph">转到新学校时，班主任安排了个打橄榄球的男生当我的前桌，让我监督他学习。年少的互动很纯粹，他会刻意逗我、照顾我的情绪，我也慢慢动心，不顾身边所有人的反对，和他走到了一起。</p>
<p class="letter-paragraph">他曾郑重承诺会收心努力，和我奔赴同一个未来。但长久相处下来，他始终难以改变惰性，承诺反复落空。加上他骨子里的自卑与敏感，常常陷入无端内耗和猜忌，不断消耗我的情绪。我一次次期待、一次次失望，耗尽了所有热情。</p>
<p class="letter-paragraph">在我彻底失望，准备出国时，他才幡然醒悟想要努力追赶。但情绪和真心早已被消耗殆尽，我们之间的心态和眼界差距早已无法弥补，最后我坦然放手。</p>
<p class="letter-paragraph">这段无疾而终的感情，让我第一次深刻体会到：失恋的遗憾和内耗，真的可以困住一个人很久。</p>
<p class="letter-paragraph">在我慢慢走出情伤、试着和遗憾和解的那一年，我遭遇了人生第一次重大离别——我的姥姥骤然离世。</p>
<p class="letter-paragraph">那段时间，巨大的悲伤将我击溃。</p>
<p class="letter-paragraph">我深陷情绪低谷，满心愧疚与不舍，无数个深夜独自消化思念和遗憾。</p>
<p class="letter-paragraph">我第一次明白，亲人的离别不是瞬间的痛哭，而是往后漫长日子里，反复想起、反复遗憾的自我拉扯。</p>
<p class="letter-paragraph">所幸身边有人温柔陪伴、耐心倾听，慢慢引导我接纳失去、与离别和解，让我慢慢走出了丧亲的阴霾，学会带着思念好好生活。</p>
<p class="letter-paragraph">经历过失恋的内耗，也经历过亲人的永别，我太懂普通人面对离别的无助。</p>
<p class="letter-paragraph">因为自己淋过雨，所以我想为所有困在离别里的人撑一把伞，决定打造一款专门应对离别与遗憾的 AI 陪伴产品。</p>
<p class="letter-paragraph">我们想帮每一个被过去困住的人，好好和遗憾和解、和自己和解。Make Again 和市面上普通的情绪产品都不一样。它会全程温柔倾听、稳稳承接你的所有负面情绪，耐心陪你梳理过往，帮你学会“带着回忆往前走”，而不是强迫自己遗忘和释怀。</p>
<p class="letter-paragraph">我们想做的，从来不是快速抹平你的难过，而是给你一个可以表达、也可以暂时休息的情绪角落，让每一份遗憾都有归处，每一段离别都能被温柔安放。</p>
        <span class="letter-sign">Make Again 主创团队</span>
        <button class="continue-letter" id="beginButton" data-letter-action="begin">开始旅程</button>
        <button class="back-letter" id="backButton" data-letter-action="goBack">返回</button>

<script>
(() => {
  'use strict';
  const get = id => document.getElementById(id);
  const phone = get('phone'), mount = get('letterMount'), tabbar = get('tabbar');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let currentPage = 'home', letterReturn = 'home', firstLetter = true, busy = false, timers = [], arrival = null, loginPending = false;
  const later = (callback, delay) => { const timer = setTimeout(callback, delay); timers.push(timer); return timer; };
  function clearTimers() { timers.forEach(clearTimeout); timers = []; if (arrival) { arrival.cancel(); arrival = null; } phone.querySelectorAll('.ma-arrival-paper').forEach(node => node.remove()); }
  const iconPaths = {
    home: '<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
    chat: '<path d="M4 4h16v13H9l-5 4Z"/><path d="M8 9h8M8 13h5"/>',
    collection: '<path d="M5 3h14v18l-7-4-7 4Z"/>',
    profile: '<circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3Z"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="1"/><path d="m2 5 10 8L22 5"/>',
    lock: '<rect x="4" y="10" width="16" height="12" rx="2"/><path d="M7 10V6a5 5 0 0 1 10 0v4M12 15v3"/>',
    login: '<path d="M14 3h6v18h-6M2 12h13m-4-4 4 4-4 4"/>'
  };
  document.querySelectorAll('[data-icon]').forEach(node => { node.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + iconPaths[node.dataset.icon] + '</svg>'; });
  get('clock').textContent = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
  function selectCollection(kind) {
    document.querySelectorAll('[data-kind]').forEach(button => { const active = button.dataset.kind === kind; button.classList.toggle('active', active); button.setAttribute('aria-selected', String(active)); });
    get('letterCard').hidden = kind !== 'letters'; get('emptyCollection').hidden = kind === 'letters'; get('placedNote').hidden = true;
  }
  function setPage(page) {
    currentPage = page;
    ['home', 'chat', 'collection', 'profile'].forEach(id => { get(id).hidden = id !== page; });
    tabbar.querySelectorAll('[data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === page));
    get('navTitle').textContent = 'Make Again'; get('navBack').hidden = true;
    get(page).scrollTop = 0;
  }
  function closeLetter() {
    if (busy) return;
    clearTimers(); mount.hidden = true; mount.innerHTML = ''; tabbar.hidden = false; setPage(letterReturn);
  }
  function openLetter(first = false) {
    clearTimers(); busy = false; firstLetter = first; letterReturn = currentPage;
    get('splash').hidden = true; tabbar.hidden = true; mount.hidden = false;
    mount.innerHTML = get('letterTemplate').innerHTML;
    const overlay = get('letterOverlay'), paper = get('letterPaper');
    get('beginButton').hidden = !first; get('backButton').hidden = first;
    get('navTitle').textContent = first ? 'Make Again' : '给你的一封信'; get('navBack').hidden = first;
  }
  function startOpen() {
    const overlay = get('letterOverlay'), paper = get('letterPaper');
    if (overlay.classList.contains('ml-open')) return;
    overlay.classList.add('ml-open');
    later(() => {
      overlay.classList.add('is-reading'); paper.hidden = false;
      paper.querySelector('.letter-scroll').focus({ preventScroll: true });
    }, reduceMotion ? 150 : 6250);
  }
  function begin() {
    if (busy || !firstLetter) return;
    busy = true; const paper = get('letterPaper'), rect = paper.getBoundingClientRect();
    const ghost = paper.cloneNode(true); ghost.removeAttribute('id'); ghost.removeAttribute('hidden'); ghost.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
    ghost.classList.add('ma-arrival-paper'); ghost.setAttribute('aria-hidden', 'true');
    Object.assign(ghost.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px' });
    clearTimers(); phone.appendChild(ghost); ghost.querySelector('.letter-scroll').scrollTop = paper.querySelector('.letter-scroll').scrollTop;
    mount.hidden = true; mount.innerHTML = ''; tabbar.hidden = false; setPage('collection'); selectCollection('letters');
    const card = get('letterCard'), target = card.getBoundingClientRect();
    const dx = target.left + target.width / 2 - rect.left - rect.width / 2, dy = target.top + target.height / 2 - rect.top - rect.height / 2;
    arrival = ghost.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + target.width / rect.width + ',' + target.height / rect.height + ')', opacity: .15 }], { duration: reduceMotion ? 1 : 900, easing: 'cubic-bezier(.22,.7,.26,1)', fill: 'forwards' });
    arrival.onfinish = () => { ghost.remove(); arrival = null; busy = false; card.classList.remove('ma-letter-placed'); void card.offsetWidth; card.classList.add('ma-letter-placed'); get('placedNote').hidden = false; later(() => { get('placedNote').hidden = true; }, 2400); };
  }
  function replay() {
    clearTimers(); busy = false; loginPending = false; mount.hidden = true; mount.innerHTML = ''; get('dialogLayer').hidden = true; setPage('home'); tabbar.hidden = true;
    get('splash').hidden = false;
    get('navTitle').textContent = '';
    get('loginWechatButton').disabled = false; get('loginWechatButton').textContent = '微信登录'; get('loginError').hidden = true;
    get('splash').querySelectorAll('.brand-word,.motto-text').forEach(node => { node.style.animation = 'none'; void node.offsetWidth; node.style.animation = ''; });
  }
  function previewLogin() {
    if (loginPending) return;
    loginPending = true; get('loginWechatButton').disabled = true; get('loginWechatButton').textContent = '正在登录';
    // HTML only demonstrates the flow. The native page calls wx.login instead.
    later(() => { loginPending = false; setPage('home'); openLetter(true); }, 400);
  }
  function dialog(title, text) { get('dialogTitle').textContent = title; get('dialogContent').textContent = text; get('dialogLayer').hidden = false; get('dialogClose').focus(); }
  document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => { if (!busy) setPage(button.dataset.page); }));
  document.querySelectorAll('[data-open-letter]').forEach(button => button.addEventListener('click', () => openLetter(false)));
  document.querySelectorAll('[data-kind]').forEach(button => button.addEventListener('click', () => selectCollection(button.dataset.kind)));
  mount.addEventListener('click', event => { const button = event.target.closest('[data-letter-action]'); if (!button) return; if (button.dataset.letterAction === 'begin') begin(); if (button.dataset.letterAction === 'goBack') closeLetter(); if (button.dataset.letterAction === 'openLetter') startOpen(); });
  get('navBack').addEventListener('click', closeLetter);
  get('replay').addEventListener('click', replay);
  get('loginWechatButton').addEventListener('click', previewLogin);
  get('directLetter').addEventListener('click', () => { setPage('home'); openLetter(true); });
  get('wechatButton').addEventListener('click', () => dialog('微信登录', '微信账号登录尚未开通。你可以继续以游客身份使用，记录会保存在本机。'));
  get('privacyButton').addEventListener('click', () => dialog('隐私说明', '倾诉与陪伴信息只保存在本机。微信账号服务尚未开通，暂不提供云端同步。'));
  get('dialogClose').addEventListener('click', () => { get('dialogLayer').hidden = true; get('wechatButton').focus(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { if (!get('dialogLayer').hidden) get('dialogLayer').hidden = true; else if (!mount.hidden && !firstLetter) closeLetter(); } });
  replay();
})();
</script>
